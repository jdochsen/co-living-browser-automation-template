<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Co-Living Browser Automation</title>
<style>
* { box-sizing: border-box; }
html { width: 440px; }
body { max-width: 100vw; margin: 0; padding: 16px; color: #18243a; font: 13px/1.4 system-ui, sans-serif; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
h1 { margin: 0; font-size: 19px; line-height: 1.25; }
#extension-version { color: #52647d; white-space: nowrap; font-size: 11px; }
nav, #sources, .fields, .contact-tools, .actions { display: grid; gap: 8px; }
nav { grid-template-columns: 2fr 1.16fr; margin-bottom: 16px; }
#sources, .fields, .contact-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fields { gap: 12px; }
label { display: block; font-weight: 600; margin-bottom: 4px; }
input, textarea, select { width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid #c5d0df; border-radius: 5px; color: inherit; font: inherit; }
select { margin-bottom: 10px; }
textarea { resize: vertical; margin-top: 8px; }
button { min-height: 34px; padding: 5px 6px; border: 1px solid #c5d0df; border-radius: 5px; background: #f3f6fa; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"] { background: #18243a; color: white; }
.contact-tools { margin: 4px 0 12px; }
.contact-tools button { justify-self: start; border-color: transparent; background: transparent; color: #24549b; padding-inline: 0; }
details { border: 1px solid #c5d0df; border-radius: 5px; padding: 8px 10px; margin-bottom: 14px; }
summary { cursor: pointer; font-weight: 600; }
.actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.actions button { min-height: 38px; font-size: 12px; }
.actions button:first-child { background: #24549b; border-color: #24549b; color: white; }
:focus-visible { outline: 2px solid #24549b; outline-offset: 2px; }
#status { margin: 10px 0 0; color: #52647d; }
#status:empty, [hidden] { display: none !important; }
@media (max-width: 390px) {
  html { overflow-x: hidden; }
  header { flex-wrap: wrap; gap: 4px 10px; }
  nav { grid-template-columns: 1fr; }
  .fields, .actions { grid-template-columns: 1fr; }
}
</style>
<header><h1>Co-Living Browser Automation</h1><span id="extension-version"></span><button id="open-settings" type="button">Settings</button></header>
<nav aria-label="Source and saved contacts">
  <div role="group" aria-label="Source website" id="sources">
    <button type="button" data-source="turbotenant" aria-pressed="true">TurboTenant</button>
    <button type="button" data-source="padsplit" aria-pressed="false">PadSplit</button>
  </div>
  <button type="button" id="saved-contacts">Saved contacts</button>
</nav>
<p id="selected-note" hidden>Using a saved contact. <button type="button" id="read-page">Read current page</button></p>
<form>
  <div class="fields">
    <div><label for="name">Full name</label><input id="name" required maxlength="120"></div>
    <div><label for="phone">US phone number</label><input id="phone" type="tel" required maxlength="24"></div>
    <div id="email-wrap"><label for="email">Email address</label><input id="email" type="email"></div>
    <div id="property-wrap"><label for="property">Property address</label><input id="property" maxlength="300"></div>
  </div>
  <div class="contact-tools">
    <button type="button" id="copy-email">Copy email</button>
    <button type="button" id="save-contact" disabled>Save contact to browser</button>
  </div>
  <div id="template-wrap">
  <label for="message-template">Message template</label>
  <select id="message-template">
    <option value="turbotenant">TurboTenant message</option>
    <option value="padsplit" selected>PadSplit message</option>
  </select>
  </div>
  <details>
    <summary id="preview-label">Message preview</summary>
    <textarea id="draft" aria-labelledby="preview-label" rows="5"></textarea>
  </details>
  <div class="actions">
    <button type="submit" disabled>Prepare text</button>
    <button type="submit" id="contact" disabled>Prepare contact</button>
    <button type="submit" id="use-voice" disabled>Use in Google Voice</button>
  </div>
</form>
<p id="status" role="status"></p>
<script src="settings-data.js"></script>
<script src="popup.js"></script>
</html>
